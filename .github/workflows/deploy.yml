name: Deploy Jianghu Chronicles

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: jianghu-chronicles-prod-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
    steps:
      - name: Deploy to production via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          port: ${{ secrets.DEPLOY_PORT }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          envs: DEPLOY_PATH
          script: |
            set -e
            cd "$DEPLOY_PATH"
            git fetch origin main
            git reset --hard origin/main
            if [ ! -f .env.server ]; then cp .env.server.example .env.server; fi
            sed -i 's/^REACT_APP_ENV=.*/REACT_APP_ENV=Production/' .env.server || echo 'REACT_APP_ENV=Production' >> .env.server
            chmod +x scripts/deploy-prod.sh
            ./scripts/deploy-prod.sh
