name: Deploy Jianghu Chronicles

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: jianghu-chronicles-prod-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: 武汉2C2G
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
    steps:
      - name: Check required deployment secrets
        run: |
          set -e
          missing=0
          if [ -z "${DEPLOY_HOST:-}" ]; then
            echo "Missing DEPLOY_HOST. Configure it under repository Environment: 武汉2C2G."
            missing=1
          fi
          if [ -z "${DEPLOY_PORT:-}" ]; then
            echo "Missing DEPLOY_PORT. Configure it under repository Environment: 武汉2C2G."
            missing=1
          fi
          if [ -z "${DEPLOY_USER:-}" ]; then
            echo "Missing DEPLOY_USER. Configure it under repository Environment: 武汉2C2G."
            missing=1
          fi
          if [ -z "${DEPLOY_SSH_KEY:-}" ]; then
            echo "Missing DEPLOY_SSH_KEY. Configure it under repository Environment: 武汉2C2G."
            missing=1
          fi
          exit "${missing}"

      - name: Deploy to production via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          port: ${{ secrets.DEPLOY_PORT }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            export APP_DIR='/root/maple-fighters'
            cd "${APP_DIR}"
            git fetch origin main
            git reset --hard origin/main
            chmod +x scripts/deploy-prod.sh
            ./scripts/deploy-prod.sh
