events {
    worker_connections 4096;
}

http {
    include mime.types;

    # WebAssembly MIME type for Unity WebGL builds.
    types {
        application/wasm wasm;
    }

    # WebSocket upgrade helper.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    upstream game {
        server game-service:50051;
        keepalive 32;
    }

    server {
        listen 80 default_server;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Simple health check for load balancers / deployment scripts.
        location = /healthz {
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # Frontend static files.
        location / {
            gzip_static on;
            try_files $uri $uri/ /index.html;
        }

        # Browser WebSocket -> internal game-service.
        # Players connect to the same public IP/port as the web page.
        location /game {
            proxy_pass http://game/;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 60s;
            proxy_send_timeout 86400s;
            proxy_read_timeout 86400s;

            # Avoid buffering real-time messages.
            proxy_buffering off;
        }
    }
}
