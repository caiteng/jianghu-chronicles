events {
    worker_connections 4096;
}

http {
    include mime.types;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    upstream game {
        server game-service:50051;
        keepalive 32;
    }

    server {
        listen 80 default_server;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        location = /healthz {
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location = /gameprovider/games {
            default_type application/json;

            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "*" always;
            add_header Cache-Control "no-store" always;

            if ($request_method = OPTIONS) {
                return 204;
            }

            return 200 '[{"id":"local","gameId":"local","name":"Local Server","displayName":"Local Server","title":"Local Server","description":"Local Maple Fighters Server","host":"8.148.22.139","ip":"8.148.22.139","address":"8.148.22.139","port":80,"httpPort":80,"webSocketPort":80,"wsPort":80,"url":"ws://8.148.22.139/game","uri":"ws://8.148.22.139/game","endpoint":"ws://8.148.22.139/game","webSocketUrl":"ws://8.148.22.139/game","websocketUrl":"ws://8.148.22.139/game","connectionUrl":"ws://8.148.22.139/game","serverUrl":"ws://8.148.22.139/game","gameServerUrl":"ws://8.148.22.139/game","path":"/game","online":true,"isOnline":true,"enabled":true,"available":true,"players":0,"currentPlayers":0,"maxPlayers":100,"maxConnections":100}]';
        }

        location ~ ^/files/.*\.framework\.js$ {
            default_type application/javascript;
            add_header Content-Encoding gzip always;
            add_header Vary Accept-Encoding always;
            try_files $uri.gz =404;
        }

        location ~ ^/files/.*\.wasm$ {
            default_type application/wasm;
            add_header Content-Encoding gzip always;
            add_header Vary Accept-Encoding always;
            try_files $uri.gz =404;
        }

        location ~ ^/files/.*\.data$ {
            default_type application/octet-stream;
            add_header Content-Encoding gzip always;
            add_header Vary Accept-Encoding always;
            try_files $uri.gz =404;
        }

        location /files/ {
            try_files $uri =404;
        }

        location /game {
            proxy_pass http://game/;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 60s;
            proxy_send_timeout 86400s;
            proxy_read_timeout 86400s;

            proxy_buffering off;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
