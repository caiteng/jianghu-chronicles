version: "3.8"

# Maple Fighters server deployment compose.
#
# Put this file in the original codingben/maple-fighters repository root.
#
# Start:
#   cp .env.server.example .env.server
#   docker compose -f docker-compose.server.yml --env-file .env.server up -d --build
#
# Visit:
#   http://SERVER_IP:${PUBLIC_HTTP_PORT:-80}

services:
  frontend:
    image: jianghu-chronicles-frontend:server
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    environment:
      # Keep development mode unless you intentionally change the frontend runtime behavior.
      REACT_APP_ENV: "${REACT_APP_ENV:-Development}"
      # The original production setup can restrict requests to Cloudflare IPs.
      # For direct-IP deployment, all client IPs must be allowed.
      REMOVE_CF_IPS: "true"
    ports:
      - "${PUBLIC_HTTP_PORT:-80}:80"
    depends_on:
      - game-service
    restart: unless-stopped
    networks:
      - maple-net

  game-service:
    image: jianghu-chronicles-game-service:server
    build:
      context: ./src/game-service/Game.Application
    restart: unless-stopped
    expose:
      - "50051"
    environment:
      # Internal listener. Browser clients should never connect to this port directly.
      # Nginx proxies /game WebSocket traffic to this service.
      URL: "ws://0.0.0.0:50051"

      # Logs
      FLECK_LOG: "${FLECK_LOG:-Info}"
      IM_LOG: "${IM_LOG:-Info}"
      GAME_LOG: "${GAME_LOG:-Info}"

      # Original project config source.
      CONFIG_SOURCE: "${CONFIG_SOURCE:-v2.0}"

      # Multiplayer capacity.
      MAX_CONNECTIONS: "${MAX_CONNECTIONS:-100}"
    networks:
      - maple-net

networks:
  maple-net:
    driver: bridge
